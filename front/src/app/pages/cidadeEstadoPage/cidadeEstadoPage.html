<main>
  <h3>
    Busque seu estado e cidade para calcular o frete
  </h3>

  <app-estado-cidade
    (estadoSelecionadoChange)="estadoEscolhido = $event"
    (municipioSelecionadoChange)="municipioEscolhido = $event"
  ></app-estado-cidade>

<div class="nota-container">
  <div class="notinha">
    <div class="estado">
      <h3>Estado: </h3>
            <p>{{estadoEscolhido?.nome}}</p>
    </div>


    <div class="municipio">
      <h3>Municipio: </h3>
            <p>{{municipioEscolhido?.nome}}</p>
    </div>
  </div>
</div>
</main>
