<main>
  <div class="title-container">
    <h1>Lista de Notas fiscais</h1>
    <p class="subtitle">Gerencie suas notas fiscais de forma eficiente e organizada.</p>
  </div>

  <div id="data-grid-demo">
    <dx-data-grid
      id="gridContainer"
      [dataSource]="notas"
      keyExpr="ID"
      [showBorders]="true"
    >
      <dxo-data-grid-paging
        [enabled]="false">
      </dxo-data-grid-paging>

      <dxo-data-grid-editing
        mode="popup"
        [allowUpdating]="true"
        [allowAdding]="true"
        [allowDeleting]="true"
      >
        <dxo-data-grid-popup
          title="Nova nota"
          [showTitle]="true"
          [width]="700"
          [height]="525"
        >
        </dxo-data-grid-popup>
        <dxo-data-grid-form>
          <dxi-data-grid-item itemType="group"
                              caption="Dados da nota" [colCount]="2" [colSpan]="2">

            <dxi-data-grid-item
              dataField="Numero nota">
            </dxi-data-grid-item>



            <dxi-data-grid-item
              dataField="Data">
            </dxi-data-grid-item>

            <dxi-data-grid-item class="ajuste-layout">
              <div class="dx-field-label">Cliente:</div>
              <div class="dx-field-value">
                <dx-select-box
                  [items]="clientes"
                  placeholder="Selecione uma cliente"
                  [inputAttr]="{ 'aria-label': 'Simple Product' }"
                  [showClearButton]="true"
                  displayExpr="nome"
                  valueExpr="nome"
                  width="315px"
                ></dx-select-box>
              </div>
            </dxi-data-grid-item>

          </dxi-data-grid-item>

          <dxi-data-grid-item
            itemType="group"
            caption="Itens"
            [colCount]="2"
            [colSpan]="2"
          >
            <div *ngFor="let item of itens; let i = index" class="item-container">
              <div class="ajuste-layout">
                <div class="dx-field-label">Produto:</div>
                <div class="dx-field-value">
                  <dx-select-box
                    [items]="produtos"
                    placeholder="Selecione um produto"
                    [(value)]="item.produtoNome"
                    [inputAttr]="{ 'aria-label': 'Simple Product' }"
                    [showClearButton]="true"
                    displayExpr="nome"
                    valueExpr="nome"
                    width="315px"
                  ></dx-select-box>
                </div>
              </div>

              <div class="ajuste-layout">
                <div class="dx-field-label">Quantidade:</div>
                <div class="dx-field-value">
                  <dx-number-box
                    [(value)]="item.quantidade"
                    type="number"
                    placeholder="Quantidade"
                    width="315px">
                  </dx-number-box>
                </div>
              </div>

              <dx-button
                class="btn-lixeira"
                icon="trash"
                hint="Excluir"
                type="danger"
                (onClick)="excluirLinha(i)">
              </dx-button>
            </div>

            <dx-button
              text="Adicionar Item"
              icon="plus"
              (onClick)="adicionarItem()">
            </dx-button>

          </dxi-data-grid-item>

        </dxo-data-grid-form>
      </dxo-data-grid-editing>

      <dxi-data-grid-column
        dataField="Prefix" caption="Notas fiscais" [width]="130">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="id">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="Número da nota">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="Cliente">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="Data" dataType="date">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="Total">
      </dxi-data-grid-column>

      <dxi-data-grid-column dataField="Itens" [visible]="false">
      </dxi-data-grid-column>
    </dx-data-grid>
  </div>
</main>
