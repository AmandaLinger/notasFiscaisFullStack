<main>
  <div class="title-container">
    <h1>Lista de Notas fiscais</h1>
    <p class="subtitle">Gerencie suas notas fiscais de forma eficiente e organizada.</p>
  </div>

  <div id="data-grid-demo">
    <dx-data-grid
      id="gridContainer"
      [dataSource]="notas"
      keyExpr="ID"
      [showBorders]="true"
    >
      <dxo-data-grid-paging
        [enabled]="false">
      </dxo-data-grid-paging>

      <dxo-data-grid-editing
        mode="popup"
        [allowUpdating]="true"
        [allowAdding]="true"
        [allowDeleting]="true"
      >
        <dxo-data-grid-popup
          title="Nova nota"
          [showTitle]="true"
          [width]="700"
          [height]="525"
        >
        </dxo-data-grid-popup>
        <dxo-data-grid-form>
          <dxi-data-grid-item itemType="group" [colCount]="2" [colSpan]="2">

            <dxi-data-grid-item
              dataField="Numero nota">
            </dxi-data-grid-item>



            <dxi-data-grid-item
              dataField="Data">
            </dxi-data-grid-item>

            <dxi-data-grid-item class="ajuste-layout">
              <div class="dx-field-label">Cliente</div>
              <div class="dx-field-value">
                <dx-select-box
                  [items]="clientes"
                  placeholder="Selecione uma cliente"
                  [inputAttr]="{ 'aria-label': 'Simple Product' }"
                  [showClearButton]="true"
                  displayExpr="nome"
                  valueExpr="nome"
                ></dx-select-box>
              </div>
            </dxi-data-grid-item>

          </dxi-data-grid-item>


        </dxo-data-grid-form>
      </dxo-data-grid-editing>

      <dxi-data-grid-column dataField="Prefix" caption="Notas fiscais" [width]="130">
      </dxi-data-grid-column>
      <dxi-data-grid-column dataField="id"></dxi-data-grid-column>
      <dxi-data-grid-column dataField="Cliente"></dxi-data-grid-column>
      <dxi-data-grid-column dataField="Data" dataType="date">
      </dxi-data-grid-column>
      <dxi-data-grid-column dataField="Total">
      </dxi-data-grid-column>

      <dxi-data-grid-column dataField="Address" [visible]="false">
      </dxi-data-grid-column>
      <dxi-data-grid-column dataField="Notes" [visible]="false">
      </dxi-data-grid-column>
    </dx-data-grid>
  </div>
</main>
