<main>
  <div class="title-container">
    <h1>Lista de Notas fiscais</h1>
    <p class="subtitle">Gerencie suas notas fiscais de forma eficiente e organizada.</p>
  </div>

  <div id="data-grid-demo">
    <dx-data-grid
      id="gridContainer"
      [dataSource]="notas"
      keyExpr="id"
      [showBorders]="true"
      (onInitNewRow)="onInitNewRow($event)"
      (onSaving)="onSavingNota($event)"
      (onEditorPreparing)="onEditorPreparing($event)">
    >

      <dxo-data-grid-paging
        [enabled]="false">
      </dxo-data-grid-paging>

      <dxo-data-grid-editing
        mode="popup"
        [allowUpdating]="true"
        [allowAdding]="true"
        [allowDeleting]="true"
      >
        <dxo-data-grid-popup
          title="Nova nota"
          [showTitle]="true"
          [width]="700"
          [height]="525"
        >
        </dxo-data-grid-popup>

        <dxo-data-grid-form>

          <!-- Campos do popUp  -->
          <dxi-data-grid-item
            itemType="group"
            caption="Dados da nota"
            [colCount]="2" [colSpan]="2">

            <dxi-data-grid-item
              dataField="numeroNotaFiscal"
              editorType="dxNumberBox"
              [label]="{ text: 'Número da Nota Fiscal' }">
            </dxi-data-grid-item>

            <dxi-data-grid-item
              dataField="data"
              editorType="dxDateBox"
              [label]="{ text: 'Data da Nota Fiscal' }">
            </dxi-data-grid-item>

            <dxi-data-grid-item
              dataField="cliente">
            </dxi-data-grid-item>

          </dxi-data-grid-item>

          <dxi-data-grid-item
            dataField="itens"
            class="style-subtitle"
          ></dxi-data-grid-item>

        </dxo-data-grid-form>


      </dxo-data-grid-editing>


      <!-- Colunas -->

      <dxi-data-grid-column
        dataField="id"
        caption="ID">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="numeroNotaFiscal"
        caption="Número">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="cliente"
        caption="Cliente"
        cellTemplate="clienteCellTemplate"
        editCellTemplate="clienteEditCellTemplate"
      >
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="data"
        dataType="date"
        caption="Data">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="precoTotal"
        caption="Valor Total">
      </dxi-data-grid-column>

      <dxi-data-grid-column
        dataField="itens"
        [visible]="false"
        editCellTemplate="itensEditCellTemplate">
      ></dxi-data-grid-column>

      <div *dxTemplate="let data of 'itensEditCellTemplate'">
        <dx-data-grid
        [dataSource]="data.value"
        [width]="650"
        (onRowInserted)="onItemChanged(data)"
        (onRowUpdated)="onItemChanged(data)"
        (onRowRemoved)="onItemChanged(data)">

          <dxo-data-grid-editing
            mode="row"
            [allowUpdating]="true"
            [allowAdding]="true"
            [allowDeleting]="true"
          ></dxo-data-grid-editing>

          <dxi-data-grid-column
            dataField="produto"
            caption="Produto"
            cellTemplate="produtoCellTemplate"
            editCellTemplate="produtoEditor"
          ></dxi-data-grid-column>

          <div *dxTemplate="let data of 'produtoCellTemplate'">
            {{ data.value?.nome }}
          </div>

          <div *dxTemplate="let cell of 'produtoEditor'">

            {{cell.data | json}}
            <br>
            {{produtos | json}}

            <dx-select-box
              [items]="produtos"
              displayExpr="nome"
              valueExpr="id"
              [value]="produtoSelecionado(cell.data)"
              (onValueChanged)="onProdutoChange($event, cell.data)">
            ></dx-select-box>
          </div>


          <dxi-data-grid-column
            dataField="quantidade"
          ></dxi-data-grid-column>

          <dxi-data-grid-column
            caption="Subtotal"
            [calculateCellValue]="calcularSubtotalProduto">
          </dxi-data-grid-column>

        </dx-data-grid>

      </div>

      <div *dxTemplate="let data of 'clienteCellTemplate'">
        {{ data.value?.nome }}
      </div>

      <div *dxTemplate="let cell of 'clienteEditCellTemplate'">
        <dx-select-box
          [items]="clientes"
          displayExpr="nome"
          valueExpr="codigo"
          [value]="cell.data.cliente?.codigo"
          (onValueChanged)="onClienteChange($event, cell)">
        </dx-select-box>
      </div>

    </dx-data-grid>
  </div>
</main>
